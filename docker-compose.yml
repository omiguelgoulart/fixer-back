version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    container_name: postgres
    environment:
      POSTGRES_USER: docker_user
      POSTGRES_PASSWORD: docker1234
      POSTGRES_DB: docker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

  app:
    build: .
    container_name: app
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://docker_user:docker1234@db:5432/docker_db"
    ports:
      - "3001:3001"
    networks:
      - app-net
    volumes:
      - .:/app
    command: npm run dev

volumes:
  postgres_data:

networks:
  app-net:
